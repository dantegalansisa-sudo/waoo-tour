<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "name": "Excursiones en Punta Cana",
  "url": "https://waoootoursrd.com/tours.html",
  "description": "Catálogo completo de excursiones y tours en Punta Cana con precios por persona.",
  "isPartOf": { "@id": "https://waoootoursrd.com/#organizacion" },
  "breadcrumb": {
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Inicio", "item": "https://waoootoursrd.com/" },
      { "@type": "ListItem", "position": 2, "name": "Excursiones", "item": "https://waoootoursrd.com/tours.html" }
    ]

}

<body>
<div id="chrome"></div>

<div class="catalog-head">
  <div class="wrap">
    <div class="crumb"><a href="index.html" data-i18n="crumb_home">Inicio</a> › <span id="crumbCat">Excursiones</span></div>
    <h1 id="catalogTitle">Punta Cana <span>· Excursiones, Tours y Tickets</span></h1>
    <div class="filter-bar" id="filterBar"></div>
  </div>
</div>

<div class="catalog-body">
  <div class="wrap">
    <div class="catalog-toolbar">
      <div class="result-count" id="resultCount"></div>
      <div class="sortwrap">
        <label for="sortSel" data-i18n="sort_label">Ordenar por:</label>
        <select id="sortSel">
          <option value="rel" data-i18n="sort_rel">Más relevante</option>
          <option value="low" data-i18n="sort_low">Precio: menor a mayor</option>
          <option value="high" data-i18n="sort_high">Precio: mayor a menor</option>
          <option value="az" data-i18n="sort_az">Nombre A–Z</option>
        </select>
      </div>
    </div>
    <div class="grid" id="catalogGrid"></div>
    <div class="empty" id="emptyState" style="display:none">
      🔍<b data-i18n="empty_t">No encontramos excursiones</b>
      <p data-i18n="empty_p">Prueba con otra categoría o limpia la búsqueda.</p>
      <a class="btn btn-primary" href="tours.html" style="margin-top:18px" data-i18n="empty_btn">Ver todas las excursiones</a>
    </div>
  </div>
</div>

<div id="footer-slot"></div>

<script src="assets/data.js"></script>
<script src="assets/tour-photos.js"></script>
<script src="assets/supabase.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
<script>
(async () => {
  await sbBoot();
  bootCommon('tours');
  document.title = T.title_catalog;

  const params = new URLSearchParams(location.search);
  let state = {
    cat: params.get('cat') || 'all',
    q: params.get('q') || '',
    sort: 'rel',
    favOnly: location.hash === '#favoritos',
  };
  if(state.q) document.getElementById('hsearch').value = state.q;

  /* filter chips */
  const chips = [{key:'all',label:T.chip_all,icon:'combo'},{key:'fav',label:T.chip_fav,icon:'heart'},
    ...CATEGORIES.map(c=>({key:c.key,label:catLabel(c.key),icon:c.icon}))];
  function renderChips(){
    document.getElementById('filterBar').innerHTML = chips.map(c=>{
      const on = (c.key==='fav' && state.favOnly) || (c.key!=='fav' && !state.favOnly && state.cat===c.key);
      return `<button class="chip${on?' active':''}" data-chip="${c.key}">${IC[c.icon]||''}${c.label}</button>`;
    }).join('');
    document.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{
      const k = b.dataset.chip;
      if(k==='fav'){ state.favOnly=true; }
      else { state.favOnly=false; state.cat=k; }
      apply();
    });
  }

  function apply(){
    let list = TOURS.slice();
    if(state.favOnly){ const f=getFavs(); list=list.filter(t=>f.includes(t.id)); }
    else if(state.cat!=='all'){ list=list.filter(t=>t.cat===state.cat); }
    if(state.q){
      const q=state.q.toLowerCase();
      list=list.filter(t=>(t.name+' '+(t.en||TOUR_EN[t.id]||'')+' '+t.zone+' '+catLabel(t.cat)).toLowerCase().includes(q));
    }
    if(state.sort==='low') list.sort((a,b)=>a.price-b.price);
    else if(state.sort==='high') list.sort((a,b)=>b.price-a.price);
    else if(state.sort==='az') list.sort((a,b)=>tourName(a).localeCompare(tourName(b)));

    const grid=document.getElementById('catalogGrid'), empty=document.getElementById('emptyState');
    if(list.length){ grid.style.display='grid'; empty.style.display='none'; renderGrid(grid,list); }
    else { grid.style.display='none'; empty.style.display='block'; grid.innerHTML=''; }

    const label = state.favOnly ? T.favs_title
      : state.cat==='all' ? T.crumb_all : catLabel(state.cat);
    document.getElementById('resultCount').innerHTML =
      `${list.length} <span>${list.length===1?T.found_s:T.found_p}${state.q?` · "${state.q}"`:''}</span>`;
    document.getElementById('crumbCat').textContent = label;
    document.getElementById('catalogTitle').innerHTML = state.favOnly
      ? `${T.favs_title} <span>${T.in_pc}</span>`
      : state.cat==='all' ? T.cat_title
      : `${catLabel(state.cat)} <span>${T.in_pc}</span>`;
    renderChips();
  }

  document.getElementById('sortSel').onchange = e=>{ state.sort=e.target.value; apply(); };

  // live search from header
  document.getElementById('hsearch').addEventListener('input', e=>{
    state.q = e.target.value.trim(); apply();
  });

  renderChips();
  apply();
})();
</script>
</body>
</html>
