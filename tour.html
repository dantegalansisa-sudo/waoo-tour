<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excursión en Punta Cana | WAOOO Tours and Adventures</title>
<meta name="description" content="Detalles, precio y reserva de esta excursión en Punta Cana con WAOOO Tours: operador local, cancelación gratis 24h antes y reserva directa por WhatsApp.">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="theme-color" content="#FF6A13">

<meta property="og:type" content="product">
<meta property="og:site_name" content="WAOOO Tours and Adventures">
<meta property="og:locale" content="es_DO">
<meta property="og:title" content="Excursión en Punta Cana | WAOOO Tours">
<meta property="og:description" content="Reserva tu excursión en Punta Cana con tu operador local. Cancelación gratis 24h antes.">
<meta property="og:image" content="https://waoootoursrd.com/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://waoootoursrd.com/assets/og-image.jpg">

<link rel="icon" href="assets/waoo.jpeg">
<link rel="apple-touch-icon" href="assets/waoo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="chrome"></div>

<div class="wrap" id="detailRoot"></div>

<section class="related" id="relatedSection" style="display:none">
  <div class="wrap">
    <div class="head-row">
      <div><span class="eyebrow" data-i18n="ey_rel">Te puede gustar</span><h2 class="section-title" data-i18n="ti_rel">Aventuras similares</h2></div>
      <a class="btn btn-outline" href="tours.html" data-i18n="btn_viewall">Ver todas</a>
    </div>
    <div class="grid" id="relatedGrid"></div>
  </div>
</section>

<div id="footer-slot"></div>

<!-- LIGHTBOX -->
<div class="lb" id="lb" onclick="if(event.target===this)closeLB()">
  <button class="lb-x" onclick="closeLB()">✕</button>
  <button class="lb-prev" onclick="lbNav(-1)">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-next" onclick="lbNav(1)">›</button>
  <span class="lb-count" id="lbCount"></span>
</div>

<script src="assets/data.js"></script>
<script src="assets/tour-photos.js"></script>
<script src="assets/supabase.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
<script>
(async () => {
  await sbBoot();
  bootCommon('tours');

  const id = new URLSearchParams(location.search).get('id');
  const t = TOURS.find(x=>x.id===id);
  const root = document.getElementById('detailRoot');

  if(!t){
    root.innerHTML = `<div class="empty" style="padding:120px 20px">😕<b>${T.nf_t}</b>
      <a class="btn btn-primary" href="tours.html" style="margin-top:18px">${T.nf_btn}</a></div>`;
  } else {
    const name = tourName(t);
    document.title = name + ' · WAOOO Tours';
    const blurb = blurbFor(t.cat);
    const includes = includesFor(t.cat);
    const catIcon = IC[(CATEGORIES.find(c=>c.key===t.cat)||{}).icon] || '';

    /* galería: foto principal + fotos extra del tour (t.image + t.gallery) */
    const photos = [t.image, ...(t.gallery||[])].filter(Boolean);

    /* ---------- SEO de esta excursión ---------- */
    (function(){
      const SITIO = 'https://waoootoursrd.com';
      const urlTour = SITIO + '/tour.html?id=' + encodeURIComponent(t.id);
      const abs = u => u ? (u.startsWith('http') ? u : SITIO + '/' + u.replace(/^\.?\//,'')) : SITIO + '/assets/og-image.jpg';
      const desc = `${name} en ${t.zone}, Punta Cana. Desde ${money(t.price)} USD por persona · ${durLabel(t.duration)}. ${blurb}`
        .replace(/\s+/g,' ').slice(0,300).trim();

      const set = (sel, attr, val) => {
        let el = document.head.querySelector(sel);
        if(!el){
          el = document.createElement(sel.startsWith('link') ? 'link' : 'meta');
          if(sel.includes('property=')) el.setAttribute('property', sel.match(/property="([^"]+)"/)[1]);
          else if(sel.includes('name=')) el.setAttribute('name', sel.match(/name="([^"]+)"/)[1]);
          else if(sel.includes('rel=')) el.setAttribute('rel', sel.match(/rel="([^"]+)"/)[1]);
          document.head.appendChild(el);
        }
        el.setAttribute(attr, val);
      };
      set('meta[name="description"]', 'content', desc.slice(0,160));
      set('link[rel="canonical"]', 'href', urlTour);
      set('meta[property="og:title"]', 'content', name + ' | WAOOO Tours Punta Cana');
      set('meta[property="og:description"]', 'content', desc.slice(0,200));
      set('meta[property="og:url"]', 'content', urlTour);
      set('meta[property="og:image"]', 'content', abs(photos[0]));
      set('meta[name="twitter:image"]', 'content', abs(photos[0]));

      const ld = {
        "@context":"https://schema.org",
        "@type":"Product",
        "name": name,
        "description": desc,
        "image": photos.length ? photos.map(abs) : [SITIO + '/assets/og-image.jpg'],
        "category": catLabel(t.cat),
        "brand": { "@type":"Brand", "name":"WAOOO Tours and Adventures" },
        "offers": {
          "@type":"Offer",
          "url": urlTour,
          "price": t.price,
          "priceCurrency":"USD",
          "availability":"https://schema.org/InStock",
          "seller": { "@type":"TravelAgency", "name":"WAOOO Tours and Adventures", "@id": SITIO + "/#organizacion" }
        }
      };
      const bc = {
        "@context":"https://schema.org",
        "@type":"BreadcrumbList",
        "itemListElement":[
          {"@type":"ListItem","position":1,"name":"Inicio","item":SITIO + "/"},
          {"@type":"ListItem","position":2,"name":T.nav_tours,"item":SITIO + "/tours.html"},
          {"@type":"ListItem","position":3,"name":catLabel(t.cat),"item":SITIO + "/tours.html?cat=" + t.cat},
          {"@type":"ListItem","position":4,"name":name,"item":urlTour}
        ]
      };
      [ld, bc].forEach(obj => {
        const s = document.createElement('script');
        s.type = 'application/ld+json';
        s.textContent = JSON.stringify(obj);
        document.head.appendChild(s);
      });
    })();
    const slot = i => {
      if(photos[i]){
        const more = (i===2 && photos.length>3) ? `<span class="g-more">+${photos.length-3}</span>` : '';
        return `<div class="g-item" onclick="openLB(${i})"><img src="${photos[i]}" alt="${name}" loading="lazy">${more}</div>`;
      }
      return placeholder(t);
    };
    /* con una sola foto se muestra a lo ancho; con varias, mosaico */
    const gallery = photos.length === 1
      ? `<div class="gallery gallery-single"><div class="g-main">${slot(0)}</div></div>`
      : `<div class="gallery">
        <div class="g-main">${slot(0)}</div>
        <div class="g-thumb">${slot(1)}</div>
        <div class="g-thumb">${slot(2)}</div>
      </div>`;

    const favOn = getFavs().includes(t.id)?' on':'';

    root.innerHTML = `
    <div class="detail-head" style="padding-top:26px">
      <div class="crumb"><a href="index.html">${T.crumb_home}</a> › <a href="tours.html">${T.nav_tours}</a> › <a href="tours.html?cat=${t.cat}">${catLabel(t.cat)}</a></div>
      <h1>${name}</h1>
      <span class="detail-loc">${IC.pin} ${T.loc_line(t.zone)}</span>
    </div>
    ${gallery}
    <div class="detail-wrap">
      <div>
        <div class="detail-tags">
          <span class="t">${IC.clock} ${T.d_dur} ${durLabel(t.duration)}</span>
          <span class="t">${catIcon} ${catLabel(t.cat)}</span>
          <span class="t">${IC.user} ${T.d_age} ${t.minAge>0?t.minAge+'+':T.d_all_ages}</span>
          <span class="t">${IC.globe} ${T.d_langs}</span>
        </div>

        <div class="detail-section">
          <h2>${T.d_hl}</h2>
          <div class="hi-list">
            ${T.hl.map(h=>`<div class="hi"><div class="hi-ic">${IC.star}</div><div><b>${h[0]}</b><p>${h[1]}</p></div></div>`).join('')}
          </div>
        </div>

        <div class="detail-section">
          <h2>${T.d_what}</h2>
          <p>${blurb}</p>
          <p>${T.what_p2(t.zone)}</p>
        </div>

        <div class="detail-section">
          <h2>${T.d_inc}</h2>
          <ul class="inc-list">
            ${includes.map(i=>`<li>${IC.check} ${i}</li>`).join('')}
          </ul>
        </div>

        <div class="detail-section">
          <h2>${T.d_bring}</h2>
          <ul class="bring-list">${T.bring.map(b=>`<li>${b}</li>`).join('')}</ul>
        </div>

        <div class="detail-section" style="border-bottom:none">
          <h2>${T.d_know}</h2>
          <p>${T.know_html}</p>
        </div>
      </div>

      <!-- BOOKING BOX -->
      <aside>
        <div class="book-box">
          <button class="fav-btn${favOn}" data-fav="${t.id}" onclick="toggleFav('${t.id}')" style="position:static;float:right;margin-left:10px">${IC.heart}</button>
          <div class="book-from">${T.book_from}</div>
          <div class="book-price"><b>${money(t.price)}</b><small>${T.book_per}</small></div>

          <div class="book-field">
            <label>${T.book_date}</label>
            <input type="date" id="bDate">
          </div>
          <div class="book-field">
            <label>${T.book_trav}</label>
            <select id="bPax">
              ${[1,2,3,4,5,6,7,8].map(n=>`<option value="${n}">${n} ${n===1?T.person:T.people}</option>`).join('')}
              <option value="10">${T.group9}</option>
            </select>
          </div>

          <div class="book-total">
            <span>${T.book_total}</span>
            <b id="bTotal">${money(t.price)}</b>
          </div>

          <a class="btn btn-wa btn-block btn-lg" id="bReserve" target="_blank">${IC.wa} ${T.book_btn}</a>
          <button class="btn btn-outline btn-block" style="margin-top:10px" onclick="copyShare()">${IC.tag} ${T.book_share}</button>

          <div class="book-note">${IC.check} ${T.book_cancel}</div>

          <div class="book-help">${T.book_help(WAOOO)}</div>
        </div>
      </aside>
    </div>`;

    /* booking logic */
    const dateEl=document.getElementById('bDate'), paxEl=document.getElementById('bPax'),
          totalEl=document.getElementById('bTotal'), reserveEl=document.getElementById('bReserve');
    // default date = today
    dateEl.value = new Date().toISOString().slice(0,10);
    dateEl.min = new Date().toISOString().slice(0,10);

    function refresh(){
      const pax = parseInt(paxEl.value)||1;
      const total = t.price*pax;
      totalEl.textContent = money(total);
      reserveEl.href = waLink(T.wa_book({
        name, zone: t.zone, date: dateEl.value,
        pax: paxEl.options[paxEl.selectedIndex].text, total: money(total),
      }));
    }
    paxEl.onchange=refresh; dateEl.onchange=refresh; refresh();

    window.copyShare = function(){
      const msg = T.share_msg({name, price: money(t.price), url: location.href});
      if(navigator.clipboard){ navigator.clipboard.writeText(msg); toast(T.toast_copied); }
      else toast(T.toast_copy_manual);
    };

    /* lightbox */
    let lbI = 0;
    const lbEl = document.getElementById('lb');
    function lbShow(){
      document.getElementById('lbImg').src = photos[lbI];
      document.getElementById('lbCount').textContent = (lbI+1)+' / '+photos.length;
      document.querySelectorAll('.lb-prev,.lb-next').forEach(b=>b.style.display = photos.length>1?'grid':'none');
    }
    window.openLB = function(i){ if(!photos[i]) return; lbI=i; lbShow(); lbEl.classList.add('open'); };
    window.closeLB = function(){ lbEl.classList.remove('open'); };
    window.lbNav = function(d){ lbI=(lbI+d+photos.length)%photos.length; lbShow(); };
    document.addEventListener('keydown', e=>{
      if(!lbEl.classList.contains('open')) return;
      if(e.key==='Escape') closeLB();
      else if(e.key==='ArrowRight') lbNav(1);
      else if(e.key==='ArrowLeft') lbNav(-1);
    });

    /* related */
    const related = TOURS.filter(x=>x.cat===t.cat && x.id!==t.id).slice(0,4);
    const rel = related.length<4 ? related.concat(TOURS.filter(x=>x.cat!==t.cat && x.id!==t.id).slice(0,4-related.length)) : related;
    if(rel.length){
      document.getElementById('relatedSection').style.display='block';
      renderGrid(document.getElementById('relatedGrid'), rel);
    }
    window.scrollTo(0,0);
  }
})();
</script>
</body>
</html>
