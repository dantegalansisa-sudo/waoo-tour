<style>
/* ===== hero compacto ===== */
.ghero{background:var(--ink);color:#fff;position:relative;overflow:hidden;padding:70px 0 60px}
.ghero::before{content:"";position:absolute;top:-40%;right:-8%;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle,rgba(242,72,13,.25),transparent 62%)}
.ghero::after{content:"";position:absolute;bottom:-50%;left:-10%;width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,166,206,.2),transparent 60%)}
.ghero .wrap{position:relative;z-index:1}
.ghero h1{font-size:clamp(2.1rem,4.6vw,3.4rem);max-width:18ch}
.ghero h1 em{font-style:normal;background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.ghero p{color:#aebcc7;font-size:1.08rem;max-width:60ch;margin:16px 0 0}

/* ===== mapa ===== */
.map-sec{background:var(--ink);padding:10px 0 90px}
.map-frame{position:relative;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-lg)}
.map-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.map-scroll svg{display:block;min-width:780px;width:100%;height:auto}
.map-hint{display:none;text-align:center;color:#7d8b98;font-size:.8rem;font-weight:600;padding:10px 0 0}
@media(max-width:840px){.map-hint{display:block}}

/* animaciones del mapa */
.mk-dot{fill:var(--gold)}
.mk-ring{fill:none;stroke:var(--gold);stroke-width:2;opacity:0;transform-origin:center;transform-box:fill-box;
  animation:mkPulse 2.6s ease-out infinite;animation-delay:var(--pd,0s)}
@keyframes mkPulse{0%{transform:scale(.3);opacity:.9}70%{transform:scale(1.6);opacity:0}100%{opacity:0}}
.mk{cursor:pointer}
.mk circle.mk-dot{transition:.25s;transform-box:fill-box;transform-origin:center}
.mk:hover circle.mk-dot{transform:scale(1.6);fill:#fff}
.mk text{transition:.25s}
.mk:hover .mk-name{fill:var(--gold)}
.lead-line{stroke:rgba(255,255,255,.55);stroke-width:1.6;stroke-dasharray:1 6;stroke-linecap:round;fill:none}
.mk-name{fill:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;letter-spacing:.01em;
  paint-order:stroke;stroke:rgba(8,52,70,.55);stroke-width:4px;stroke-linejoin:round}
.mk-sub{fill:#e2f3fa;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:12.5px;
  paint-order:stroke;stroke:rgba(8,52,70,.5);stroke-width:3px;stroke-linejoin:round}
.zone-tag{fill:var(--gold);font-family:'Plus Jakarta Sans',sans-serif;font-style:italic;font-weight:700;font-size:12px;letter-spacing:.14em}
.map-title{fill:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:46px;letter-spacing:-.01em}
.map-sub{fill:rgba(255,255,255,.85);font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:15px;letter-spacing:.22em}
/* entrada escalonada */
.map-on .mapfade{opacity:0;animation:mapIn .8s ease forwards;animation-delay:var(--md,0s)}
@keyframes mapIn{to{opacity:1}}
.boat{animation:boatBob 3.2s ease-in-out infinite}
@keyframes boatBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ===== nav de secciones ===== */
.gnav{position:sticky;top:var(--header-h);z-index:40;background:rgba(251,247,241,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.gnav .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:12px;padding-bottom:12px;scrollbar-width:none}
.gnav .wrap::-webkit-scrollbar{display:none}
.gnav a{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;
  padding:8px 16px;font-weight:700;font-size:.85rem;color:var(--ink-soft);transition:.2s;white-space:nowrap}
.gnav a:hover{border-color:var(--orange);color:var(--orange)}

/* ===== secciones de la guía ===== */
.gsec{padding:64px 0;border-bottom:1px solid var(--line);scroll-margin-top:calc(var(--header-h) + 70px)}
.gsec:nth-child(even){background:var(--cream)}
.gsec .inner{display:grid;grid-template-columns:300px 1fr;gap:46px;align-items:start}
@media(max-width:880px){.gsec .inner{grid-template-columns:1fr;gap:22px}}
.gside{position:sticky;top:calc(var(--header-h) + 76px)}
@media(max-width:880px){.gside{position:static}}
.gside .gic{width:64px;height:64px;border-radius:18px;background:var(--grad-sunset);color:#fff;
  display:grid;place-items:center;margin-bottom:16px;box-shadow:0 12px 26px -10px rgba(242,72,13,.5)}
.gside .gic svg{width:32px;height:32px}
.gzone{font-size:.76rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);
  display:inline-flex;align-items:center;gap:7px;margin-bottom:8px}
.gzone::before{content:"";width:20px;height:2px;background:var(--orange)}
.gside h2{font-size:1.7rem;margin-bottom:14px}
.gchips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.gchips span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;
  font-size:.78rem;font-weight:700;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px}
.gchips span svg{color:var(--orange)}
.gbody p{color:var(--ink-soft);font-size:1.02rem;margin:0 0 14px}
.gknow{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-top:20px}
.gsec:nth-child(even) .gknow{background:var(--sand)}
.gknow b.kt{display:flex;align-items:center;gap:9px;font-size:.95rem;margin-bottom:10px;color:var(--ink)}
.gknow b.kt svg{color:var(--orange)}
.gknow li{display:flex;gap:9px;align-items:flex-start;color:var(--ink-soft);font-size:.92rem;padding:4px 0}
.gknow li::before{content:"·";color:var(--orange);font-weight:900;font-size:1.2rem;line-height:1.2}
.gctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

/* tips */
.tips-band{background:var(--ink);color:#fff;padding:70px 0}
.tips-band .section-title{color:#fff}
.tips-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:34px}
@media(max-width:880px){.tips-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:540px){.tips-grid{grid-template-columns:repeat(2,1fr)}}
.tip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;
  padding:18px 14px;text-align:center;font-weight:600;font-size:.88rem;transition:.25s}
.tip:hover{background:rgba(255,255,255,.12);transform:translateY(-4px)}
.tip .te{font-size:1.7rem;display:block;margin-bottom:8px}
.gdisclaimer{color:#7d8b98;font-size:.84rem;text-align:center;margin-top:34px}
</style>
</head>

];

function mapSVG(){
  let d = 0;
  const marks = MARKERS.map(m=>{
    const [k,x,y,lx,ly,anchor,href] = m;
    const [name,sub] = MAP_LABELS[k];
    d += 0.12;
    /* línea punteada del punto al texto */
    const line = (Math.abs(lx-x)>4||Math.abs(ly-y)>4)
      ? `<path class="lead-line" d="M${x},${y} L${lx},${ly>y?ly-16:ly+8}"/>` : '';
    return `<a href="${href}">
      <g class="mk mapfade" style="--md:${d.toFixed(2)}s">
        ${line}
        <circle class="mk-ring" cx="${x}" cy="${y}" r="13" style="--pd:${(d*2).toFixed(2)}s"/>
        <circle class="mk-dot" cx="${x}" cy="${y}" r="6.5"/>
        <text class="mk-name" x="${lx}" y="${ly}" text-anchor="${anchor}">${name}</text>
        ${sub?`<text class="mk-sub" x="${lx}" y="${ly+17}" text-anchor="${anchor}">${sub}</text>`:''}
      </g></a>`;
  }).join('');

  return `<svg viewBox="0 0 1080 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa de excursiones Punta Cana">
    <defs>
      <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#16C7C2"/><stop offset=".55" stop-color="#00A6CE"/><stop offset="1" stop-color="#0077A8"/>
      </linearGradient>
      <pattern id="landDots" width="15" height="15" patternUnits="userSpaceOnUse">
        <circle cx="7.5" cy="7.5" r="3" fill="#FBF7F1" opacity=".92"/>
      </pattern>
      <pattern id="landDotsSm" width="12" height="12" patternUnits="userSpaceOnUse">
        <circle cx="6" cy="6" r="2.2" fill="#FBF7F1" opacity=".92"/>
      </pattern>
    </defs>

    <rect width="1080" height="660" fill="url(#sea)"/>
    <path d="M0,330 Q270,300 540,330 T1080,330" stroke="rgba(255,255,255,.07)" stroke-width="2" fill="none"/>
    <path d="M0,440 Q270,410 540,440 T1080,440" stroke="rgba(255,255,255,.06)" stroke-width="2" fill="none"/>

    <!-- tierra firme: región este de RD (Sabana de la Mar → Miches → Punta Cana → La Romana) -->
    <path fill="url(#landDots)" d="M0,225 C90,216 180,212 260,215 C340,218 420,212 480,218
      C560,226 640,238 700,258 C745,275 775,300 800,335
      C818,362 830,386 832,412 C833,440 822,458 805,470
      C775,490 745,495 715,498 C670,503 640,506 610,508
      C560,512 510,516 450,519 C330,524 160,528 0,533 Z"/>
    <!-- península de Samaná (brazo hacia el este, con su bahía debajo) -->
    <path fill="url(#landDots)" d="M0,160 C30,150 62,142 95,138 C140,112 220,92 300,84
      C350,79 395,84 405,98 C410,112 380,124 335,130 C270,140 180,148 120,152
      C80,155 35,160 0,163 Z"/>
    <!-- Cayo Levantado (en la bahía de Samaná) -->
    <circle cx="330" cy="170" r="6" fill="#FBF7F1" opacity=".92"/>
    <!-- Isla Saona (frente a la costa sureste) -->
    <ellipse cx="718" cy="588" rx="64" ry="21" fill="url(#landDotsSm)" transform="rotate(-3 718 588)"/>
    <!-- Isla Catalina (pegada a La Romana) -->
    <ellipse cx="540" cy="552" rx="19" ry="11" fill="url(#landDotsSm)"/>

    <!-- título -->
    <g class="mapfade" style="--md:0s">
      <text class="map-title" x="1045" y="70" text-anchor="end">Punta Cana</text>
      <text class="map-sub" x="1045" y="98" text-anchor="end">WAOOO TOURS &amp; ADVENTURES</text>
    </g>

    <!-- barquito animado Bayahibe → Saona -->
    <g class="boat mapfade" style="--md:1.6s">
      <g>
        <animateMotion dur="7s" repeatCount="indefinite" rotate="auto"
          path="M618,518 C642,538 668,554 692,566"/>
        <path d="M0,-3 L14,2 L0,7 Z" fill="#fff"/>
        <path d="M3,-3 L3,-14 L11,-3 Z" fill="#FFB400"/>
      </g>
    </g>

    ${marks}

    <!-- inset de la isla -->
    <g class="mapfade" style="--md:1.4s" opacity=".95" transform="translate(80,0)">
      <rect x="800" y="560" width="186" height="86" rx="12" fill="rgba(11,36,52,.45)"/>
      <path fill="#FBF7F1" opacity=".85" d="M815,605 C825,592 845,588 865,592 C885,586 905,588 925,594
        C945,598 962,602 972,608 C962,616 945,620 925,618 C905,622 885,620 865,616 C845,620 825,616 815,605 Z"/>
      <rect x="930" y="588" width="44" height="34" rx="4" fill="none" stroke="#FF6A13" stroke-width="2.5"/>
      <text x="893" y="638" text-anchor="middle" fill="#fff" font-family="Plus Jakarta Sans" font-weight="700" font-size="10.5" letter-spacing=".12em">REPÚBLICA DOMINICANA</text>
    </g>
  </svg>`;
}

/* animación de entrada del mapa al verlo */
new IntersectionObserver((es,o)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('map-on');o.unobserve(e.target)}})},{threshold:.2})
  .observe(mapScroll);
